name: Build & publish container

# Builds the Tonus image and pushes it to GitHub Container Registry (GHCR).
#
# Branch & tag strategy
#   - push to dev           -> :dev, :sha-<short>            (bleeding-edge, daily work)
#   - push to main          -> :sha-<short>                  (stable line, kein rolling-alias)
#   - push tag vX.Y.Z       -> :X.Y.Z, :X.Y, :latest         (stable, promoted release)
#   - pull request          -> build only (no push), smoke-test
#
#   :dev rollt mit dem dev-Branch. main ist die "this is shippable"-Linie:
#   stabile Stände landen via Merge oder PR aus dev hier rein, Tags
#   vX.Y.Z sitzen ausschließlich auf main-Commits.
#
#   Antwort auf "was ist gerade auf main?" = der letzte semver-Tag.
#   Deshalb braucht main keinen rolling alias — :latest kommt vom Tag.
#
# Architectures: linux/amd64 + linux/arm64
#   Synology DS220+ ist amd64 (Celeron J4025); arm64 für Pi / Apple-Silicon.
#
# Cache: GitHub Actions cache (type=gha) — keeps layer reuse fast and free.
#
# Security notes:
#   - No `run:` blocks with untrusted input — only `uses:` action calls.
#   - github.actor + GITHUB_TOKEN are the standard docker/login-action pattern.

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # :dev nur aus dem dev-Branch, :latest nur aus semver-Tags
          # (`flavor: latest=auto` Default — type=semver setzt :latest
          # automatisch). Main-Pushes bekommen nur :sha-<short>.
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Tonus
            org.opencontainers.image.description=Self-hosted music acquisition. Pairs with Navidrome.
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
