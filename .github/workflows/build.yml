name: Build & publish container

# Builds the Tonus image and pushes it to GitHub Container Registry (GHCR).
#
# Tag strategy
#   - push to main          -> :dev, :sha-<short>            (bleeding-edge for testing)
#   - push tag vX.Y.Z       -> :X.Y.Z, :X.Y, :latest         (stable, promoted release)
#   - pull request to main  -> build only (no push), smoke-test
#
#   :latest now ONLY moves on a semver tag. Every main-push refreshes :dev,
#   so a `git push origin main` followed by `docker compose pull` on a dev
#   deployment is the test-loop — production stays on :0.1 (rolling within
#   minor) or :latest (only after a tag).
#
# Architectures: linux/amd64 + linux/arm64
#   Synology DS220+ is amd64 (Celeron J4025); arm64 is for Pi / Apple-Silicon hosts.
#
# Cache: GitHub Actions cache (type=gha) — keeps layer reuse fast and free.
#
# Security notes:
#   - No `run:` blocks with untrusted input — only `uses:` action calls.
#   - github.actor + GITHUB_TOKEN are the standard docker/login-action pattern.

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `flavor: latest=auto` ist Default — :latest wird NUR auf
          # semver-Tags gesetzt, NICHT auf main-pushes. Genau das wollen
          # wir hier (Stable-Channel kontrolliert promoted via tag).
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Tonus
            org.opencontainers.image.description=Self-hosted music acquisition. Pairs with Navidrome.
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
